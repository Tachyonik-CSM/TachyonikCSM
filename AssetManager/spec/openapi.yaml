      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingInput" }
      responses:
        "201": { description: "The detection as stored.", content: { application/json: { schema: { $ref: "#/components/schemas/Detection" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LimitReached" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/LimitsUnavailable" }
    delete:
      operationId: detections.deleteByIds
      tags: [Detections]
      summary: Delete the caller's own detections by id
      description: Only those without a source (AM-DATA-27).
      requestBody: { $ref: "#/components/requestBodies/Ids" }
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/detections/by-source:
    parameters:
      - $ref: "#/components/parameters/source"
    delete:
      operationId: detections.deleteBySource
      tags: [Detections]
      summary: Delete a source's detections
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: detections.clearSourcesBySource
      tags: [Detections]
      summary: Keep a source's detections, without the source
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/detections/stale:
    delete:
      operationId: detections.deleteStale
      tags: [Detections]
      summary: After a re-import, remove the detections it did not touch
      description: Service only (AM-SEC-15).
      parameters:
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/modifiedBefore"
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/internal/organisation/recalculate-score:
    post:
      operationId: assetManager.recalculateOrganisationScore
      tags: [Internal]
      summary: Recompute and send a user's Exposure and Coverage scores
      security: [ { service: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, minimum: 1 }
      responses:
        "200": { description: "Done.", content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/internal/users/{id}/data:
    delete:
      operationId: assetManager.deleteUserData
      tags: [Internal]
      summary: Delete all records of a user
      description: AM-DATA-37.
      security: [ { service: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "How many records were deleted.", content: { application/json: { schema: { type: object, properties: { deleted: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/internal/users/{id}/data/transfer:
    patch:
      operationId: assetManager.transferUserData
      tags: [Internal]
      summary: Move all records of a user to another
      description: AM-DATA-38.
      security: [ { service: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: newOwner, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: "How many records were moved.", content: { application/json: { schema: { type: object, properties: { transferred: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/internal/users/ids:
    get:
      operationId: assetManager.listUserIds
      tags: [Internal]
      summary: Every user AssetManager holds records for
      description: AM-DATA-39.
      security: [ { service: [] } ]
      responses:
        "200": { description: "The user ids.", content: { application/json: { schema: { type: object, properties: { userIds: { type: array, items: { type: integer } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/internal/users/usage:
    get:
      operationId: assetManager.userUsage
      tags: [Internal]
      summary: What each user holds against their limits
      description: |
        AM-DATA-45. Each user's host assets, vulnerabilities and detections,
        and the instance's, counted as the limits count them. A user who
        holds none is not listed. `sharedWorkspace` is true on an appliance,
        where all users' host assets count against each user's host asset
        limit; `licence` is present while the appliance's active licence caps
        the host assets of all users together. SystemManager shows the
        counts in Admin → Users.
      security: [ { service: [] } ]
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users, instance, sharedWorkspace]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [userId, hostAssets, vulnerabilities, detections]
                      properties:
                        userId: { type: integer }
                        hostAssets: { type: integer }
                        vulnerabilities: { type: integer }
                        detections: { type: integer }
                  instance:
                    type: object
                    additionalProperties: false
                    required: [hostAssets, vulnerabilities, detections]
                    properties:
                      hostAssets: { type: integer }
                      vulnerabilities: { type: integer }
                      detections: { type: integer }
                  sharedWorkspace: { type: boolean }
                  licence:
                    type: object
                    additionalProperties: false
                    required: [numAssets]
                    properties:
                      numAssets: { type: integer, description: "The licensed number of host assets." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/mcp:
    post:
      operationId: assetManager.mcp
      tags: [MCP]
      summary: The manager's MCP server
      description: |
        MCP's JSON-RPC over HTTP POST, one JSON object per request:
        `initialize`, `ping`, `tools/list`, `tools/call` (AM-API-15). The
        tools are the operations of this document marked `x-mcp`, named by
        their operationId (PA-MCP-01, PA-MCP-02, PA-MCP-04). A tool call is
        made as the API call it stands for, with the caller's session, and
        answers what that call answers the caller (PA-MCP-06). A session
        only; a request carrying the internal service key is refused with 403
        (AM-SEC-23). A notification (no `id`) is answered 202 with no body.
      security: [ { session: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { const: "2.0" }
                id: { type: [integer, string], description: Absent for a notification. }
                method: { type: string, description: "initialize, ping, tools/list, tools/call or notifications/initialized." }
                params: { type: object, description: "The method's parameters; for tools/call `{name, arguments}`." }
      responses:
        "200":
          description: The JSON-RPC answer; a failed tool call is a result with `isError`, not an error.
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc, id]
                properties:
                  jsonrpc: { const: "2.0" }
                  id: { type: [integer, string, "null"] }
                  result: { type: object, description: The method's result. }
                  error:
                    type: object
                    properties:
                      code: { type: integer }
                      message: { type: string }
        "202": { description: A notification was taken. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "The internal service key was presented (AM-SEC-23), or the account is deactivated (AM-SEC-03)."
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /health:
    get:
      operationId: assetManager.health
      tags: [Operation]
      summary: Liveness
      security: []
      responses:
        "200": { description: "The process is up.", content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
  /ready:
    get:
      operationId: assetManager.ready
      tags: [Operation]
      summary: Readiness
      security: []
      responses:
        "200": { description: "Startup has finished.", content: { application/json: { schema: { type: object, properties: { status: { const: ready } } } } } }
        "503": { description: Still starting. }
  /metrics:
    get:
      operationId: assetManager.metrics
      tags: [Operation]
      summary: Prometheus metrics
      description: For a service with the internal service key, or any session, an anonymous one included (AM-OPS-17).
      security: [ { service: [] }, { session: [] } ]
      responses:
        "200": { description: "Metrics in the Prometheus text format.", content: { text/plain: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The account is deactivated (AM-SEC-03).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

