  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A SystemManager session token (AM-SEC-02, -03).
    service:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
      description: The internal service key (AM-SEC-04). `X-User-ID` names the user acted for (AM-SEC-13).

  parameters:
    filter:
      name: filter
      in: query
      description: |
        A JSON-encoded Filter, {"rules": [{"column", "operator", "value"}],
        "matchAll"}: matchAll true joins the rules by AND, false by OR; the
        value is a string. Columns per list: assets — name, type, severity,
        score, lastSeenDays, lastScannedDays, coverageVerifiedDays,
        scanCoverageIntervalDays, detections; vulnerabilities — severity,
        name, host; detections — name, host. Operators: >, <, >=, <=, =,
        contains, does not contain; "is set" and "is not set" (no value) on
        lastScannedDays, coverageVerifiedDays and scanCoverageIntervalDays.
        Name and type take contains and does not contain; type also =.
        Scales: severity 0.0–10.0, a tenth of the answers' 0–100 (critical is
        >= 9, high >= 7, medium >= 4, low > 0); score 0–100 as answered; the
        …Days columns whole days ago (scanCoverageIntervalDays: days between
        scans); detections the number of detections on the asset. A rule
        that cannot be read (unknown column, an operator the column does not
        take, a value it cannot read) is refused with 400, naming the rule and
        why, e.g. `Filter rule 2: "severity" needs a number, not "high"`
        (AM-API-05).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Filter" }
    listOrder:
      name: order
      in: query
      description: "The direction of `sort`: asc (lowest, oldest, A first) or desc (highest, newest, Z first). Default: asc for the text fields (name, type, host), desc for the others. Without `sort` it is refused with 400 (AM-API-16)."
      schema: { type: string, enum: [asc, desc] }
    listLimit:
      name: limit
      in: query
      description: "Answer at most this many records, after filtering and sorting, from 1 to 500; more or fewer is refused with 400. `total` still counts every matching record, so a total above the number answered says the list was cut. Absent: every matching record (AM-API-04, AM-API-16)."
      schema: { type: integer, minimum: 1, maximum: 500 }
    userIdForService:
      name: userId
      in: query
      description: Whose records; from a service only, 403 from a user (AM-SEC-12). It scopes the answer to that one user, not to the user's visible set; the API bridge therefore never sends it, and names the user by `X-User-ID` instead (PA-CAT-05, PA-BR-07).
      x-bridge-bound: omit
      schema: { type: integer }
    actingRole:
      name: X-User-Role
      in: header
      description: The role of the user a service acts for, where the decision depends on it (an administrator may act on others' records). The API bridge sets it to the role of the user a routine runs for (PA-CAT-05).
      x-bridge-bound: role
      schema: { type: string }
    actingUser:
      name: X-User-ID
      in: header
      description: The user a service acts for (AM-SEC-13). Lists and statistics then cover that user's visible set — on an appliance the shared workspace (AM-PUR-10). The API bridge sets it to the user a routine runs for (PA-CAT-05).
      x-bridge-bound: user
      schema: { type: integer }
    source:
      name: source
      in: query
      required: true
      description: 'The source reference "filename (ID: N)". Matched by N; without "(ID: N)" it is refused with 400 (AM-API-06).'
      schema: { type: string, examples: ["openvas-report.xml (ID: 15)"] }
    modifiedBefore:
      name: modifiedBefore
      in: query
      required: true
      description: When the re-import started, RFC 3339.
      schema: { type: string, format: date-time }

  requestBodies:
    Ids:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids: { type: array, minItems: 1, items: { type: integer } }

  responses:
    BadRequest: { description: "The request cannot be read or is invalid, including a list filter with a rule that cannot be read (AM-API-05).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: "Not authenticated (AM-SEC-01).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: "Not allowed, a limit was reached, or the account is deactivated.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    LimitReached: { description: "The limit was reached (AM-DATA-35).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: "No such record in the visible set (AM-SEC-11).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    TooLarge: { description: "The body exceeds its limit (AM-SEC-20).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ServerError: { description: "The request failed.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    LimitsUnavailable: { description: "SystemManager could not be asked for the owner's limits, so nothing new was created (AM-DATA-44). Try again.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ChangeResult:
      description: |
        What a deletion or an unlinking did (AM-API-13). Every pair is present,
        0 and [] when it does not apply. `updated` names records that remain
        but changed (lost the source, or an asset another source still
        reports, recomputed); `skipped` names records given by id that were not
        deleted (still reported by a source, or not the caller's own).
      content:
        application/json:
          schema:
            type: object
            required: [deleted, deletedIds, updated, updatedIds, skipped, skippedIds]
            properties:
              deleted: { type: integer }
              deletedIds: { type: array, items: { type: integer } }
              updated: { type: integer }
              updatedIds: { type: array, items: { type: integer } }
              skipped: { type: integer }
              skippedIds: { type: array, items: { type: integer } }
              message:
                type: string
                deprecated: true
                description: Sent by the asset and stale endpoints for one release (AM-API-08), then removed.
              ids:
                type: array
                items: { type: integer }
                deprecated: true
                description: Sent by the finding by-source endpoints for one release (AM-API-08), the same as deletedIds or updatedIds; then removed.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Filter:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            required: [column, operator]
            properties:
              column: { type: string }
              operator: { type: string }
              value: { type: string, description: A number for the numeric columns; empty for "is set" and "is not set". }
        matchAll: { type: boolean, description: "true joins the rules by AND, false by OR." }

    AssetSource:
      type: object
      properties:
        sourceId: { type: [integer, "null"], description: null for a source known only by name. }
        sourceLabel: { type: string }
        lastSeen: { type: string, format: date-time }

    Asset:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [Host] }
        severity: { type: integer, minimum: 0, maximum: 100, description: "0–100, the highest severity of its vulnerabilities, 0 without any: critical 90–100, high 70–89, medium 40–69, low 1–39 (AM-DATA-17)." }
        score: { type: integer, minimum: 0, maximum: 100, description: "0–100, higher is better: 100 − severity; 100 with findings none of which is severe; 0 with no findings at all (AM-DATA-18)." }
        userId: { type: integer }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time, description: "The newest sighting of it or of a finding on it (AM-DATA-20)." }
        lastScanned: { type: [string, "null"], format: date-time, description: "The last vulnerability scan; null when never scanned (AM-DATA-21)." }
        lastScanCoverageVerification: { type: [string, "null"], format: date-time, description: Combined over the links (AM-DATA-30). }
        scanCoverageIntervalDays: { type: [integer, "null"], description: "The days between its scheduled scans, combined over the links; null when not monitored (AM-DATA-30)." }
        sources: { type: array, items: { $ref: "#/components/schemas/AssetSource" } }
        sourcesLabel: { type: string, description: 'The sources'' labels, comma-separated; "(unknown)" for a link without one.' }

    FindingInput:
      type: object
      required: [name, host, port]
      properties:
        name: { type: string, description: "What was found, e.g. the scanner's name of the test or finding." }
        host: { type: string, description: "The name of the asset it refers to, exactly as that asset is named — for a host, its address (AM-DATA-13)." }
        port: { type: string, examples: ["80/tcp"], description: 'Where on the host: "port/protocol" ("443/tcp", "53/udp"), or "-" when the finding concerns no port or the port is unknown. Must not be empty.' }
        sourceId: { type: integer }
        sourceLabel: { type: string }
        source:
          type: string
          deprecated: true
          description: 'The older "filename (ID: N)", read when sourceId and sourceLabel are both missing; until the release after schema version 6 (AM-DATA-16).'
        userId: { type: integer, description: Honoured from a service only. }
        lastSeen: { type: string, description: "When the source saw the finding. RFC 3339 with a zone, e.g. \"2025-07-01T00:00:00Z\"; a time without a zone (\"2025-07-01T00:00:00\") is also read. Left out, empty or unreadable: the time of the request (AM-API-07)." }

    Vulnerability:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: string }
        severity: { type: integer, minimum: 0, maximum: 100, description: "0–100, ten times the CVSS-like 0.0–10.0: critical 90–100, high 70–89, medium 40–69, low 1–39." }
        sourceId: { type: [integer, "null"] }
        sourceLabel: { type: string }
        userId: { type: integer }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    Detection:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        port: { type: string }
        sourceId: { type: [integer, "null"] }
        sourceLabel: { type: string }
        userId: { type: integer }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    AssetStats:
      type: object
      properties:
        total: { type: integer, description: "All the assets counted, every band together." }
        critical: { type: integer, description: severity 90–100 }
        high: { type: integer, description: 70–89 }
        medium: { type: integer, description: 40–69 }
        low: { type: integer, description: 1–39 }
        noThreat: { type: integer, description: "severity 0, with findings (see 02, D1)" }
        unmanaged: { type: integer, description: "no findings (see 02, D1)" }
        hostsSeen30d: { type: integer, description: last seen at most 30 days ago }
        hostsSeen180d: { type: integer, description: "more than 30, at most 180 days ago" }
        hostsSeenOlder: { type: integer, description: "more than 180 days ago, or unreadable" }
        hostsScanned2d: { type: integer, description: last scanned at most 2 days ago }
        hostsScanned10d: { type: integer, description: "more than 2, at most 10 days ago" }
        hostsScannedOlder: { type: integer, description: more than 10 days ago }
        hostsNeverScanned: { type: integer, description: "never scanned, or unreadable" }
        hostsMonitored2d: { type: integer, description: scan coverage interval of 1 or 2 days }
        hostsMonitored10d: { type: integer, description: 3 to 10 days }
        hostsMonitoredOlder: { type: integer, description: more than 10 days }
        hostsUnmonitored: { type: integer, description: no interval }
