# AssetManager
# SPDX-FileCopyrightText: 2026 Tachyonik GmbH
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The HTTP contract of AssetManager, part of specification 3 (03-api.md).
# Behaviour behind the endpoints is specified in 02-data-model-and-behaviour.md
# (AM-DATA-*), who may call them in 04-security-and-tenancy.md (AM-SEC-*).
# A change to an endpoint updates this file in the same commit (AM-API-12).

openapi: 3.1.0
info:
  title: Tachyonik AssetManager
  version: "1.0"
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    The assets, vulnerabilities and detections of each user, and which source
    reported what. Every change is also announced over the WebSocket `/ws`,
    whose messages are listed in 03-api.md.

    Errors are answered as `{"error": "<message>"}` (AM-API-02).
servers:
  - url: http://localhost:8081
security:
  - session: []
  - service: []

tags:
  - name: Assets
    description: Assets and their statistics.
  - name: Vulnerabilities
    description: Weaknesses found on hosts.
  - name: Detections
    description: Things observed on hosts, without severity.
  - name: MCP
    description: The MCP server, for signed-in users only (AM-API-15, AM-SEC-23).
  - name: Internal
    description: Service key only (AM-SEC-05).
  - name: Operation
    description: Unauthenticated; see 05-operation.md.

paths:
  /api/assets:
    get:
      operationId: assets.list
      x-bridge: read
      x-mcp: read
      x-invalidated-by: [ASSET_CREATED, ASSET_UPDATED, ASSET_DELETED, VULNERABILITY_CREATED, VULNERABILITY_UPDATED, VULNERABILITY_DELETED, DETECTION_CREATED, DETECTION_UPDATED, DETECTION_DELETED]
      tags: [Assets]
      summary: List the assets of the visible set
      description: |
        The user's assets — in a shared workspace, everyone's in it — that
        match `filter`, ordered by creation, newest first (with a filter: by
        severity, highest first), or by `sort` and `order`. An asset's
        `severity` is 0–100, the highest of its vulnerabilities (critical
        90–100, high 70–89, medium 40–69, low 1–39, 0 none); in a filter rule
        it is written 0.0–10.0. No paging: `limit` answers only the first so
        many, and `total` still counts all that match (AM-API-16). For counts
        by severity band or age, assets.stats answers without listing. A
        service names the user with `userId`; a user who sends it gets 403
        (AM-SEC-12).
      parameters:
        - $ref: "#/components/parameters/actingUser"
        - $ref: "#/components/parameters/filter"
        - $ref: "#/components/parameters/userIdForService"
        - name: sort
          in: query
          description: "Sort by this field instead of the default order; equal values stay newest first. Times sort as times; names and types ignoring case; an asset never scanned (lastScanned null) sorts as the oldest. An unknown field is refused with 400, naming the allowed ones (AM-API-16)."
          schema: { type: string, enum: [severity, score, name, type, createdAt, modifiedAt, lastSeen, lastScanned] }
        - $ref: "#/components/parameters/listOrder"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200":
          description: The assets.
          content:
            application/json:
              schema:
                type: object
                required: [assets, total, maxHostAssets]
                properties:
                  assets:
                    type: [array, "null"]
                    items: { $ref: "#/components/schemas/Asset" }
                  total: { type: integer, description: "The number of assets matching the filter — with `limit`, also those not answered." }
                  maxHostAssets:
                    type: integer
                    description: The host-asset limit in effect, the lower of the user's and the licence's; 0 is no limit.
              examples:
                anonymous-at-source-limit: { $ref: "#/components/examples/AssetListAnonymous" }
                admin-empty: { $ref: "#/components/examples/AssetListEmpty" }
                registered-nis2-red-readiness-yellow: { $ref: "#/components/examples/AssetListRegistered" }
                registered-nis2-orange-readiness-red: { $ref: "#/components/examples/AssetListRegistered" }
                registered-nis2-yellow-readiness-green-strategy-expired: { $ref: "#/components/examples/AssetListRegistered" }
                registered-nis2-orange-readiness-in-progress: { $ref: "#/components/examples/AssetListRegistered" }
                registered-nis2-impact-in-progress-recommended: { $ref: "#/components/examples/AssetListRegistered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: assets.create
      x-bridge: write
      tags: [Assets]
      summary: Create an asset, or report an existing one again
      description: |
        Upserts by owner, name and type (AM-DATA-01) and links the asset to
        the source (AM-DATA-08, -09). 201 when the asset is new, 200 when it
        existed. A new host asset beyond the limit is refused with 403
        (AM-DATA-33, -34), and with 503 while SystemManager cannot be asked
        for the limit (AM-DATA-44). Reporting an existing one again is never
        refused for a limit.
      parameters:
        - $ref: "#/components/parameters/actingRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, description: "The asset's name. For a host, its IP address (AM-DATA-05) — or its hostname when the source names no address; one asset per owner, name and type (AM-DATA-01)." }
                type: { type: string, enum: [Host], description: "The asset type; Host is the only one (AM-DATA-02). Matched ignoring case; any other type is refused with 400." }
                sourceId: { type: integer, description: The ResourceManager source id. }
                sourceLabel: { type: string, description: The source's filename. }
                userId: { type: integer, x-bridge-bound: user, description: "The owner; honoured from a service only (AM-SEC-12). The API bridge sets it to the user a routine runs for." }
                lastSeen: { type: string, description: "When the source saw the asset. RFC 3339 with a zone, e.g. \"2025-07-01T00:00:00Z\"; a time without a zone (\"2025-07-01T00:00:00\") is also read. Left out, empty or unreadable: the time of the request (AM-API-07)." }
                scanCoverageVerifiedAt: { type: string, description: "When the source verified that the asset is in a scheduled vulnerability scan — only as the source states it (AM-DATA-29). RFC 3339 with a zone, e.g. \"2025-07-01T00:00:00Z\"; a time without a zone (\"2025-07-01T00:00:00\") is also read. An unreadable time is left out with a warning (AM-API-07)." }
                scanCoverageIntervalDays: { type: integer, minimum: 1, description: "The shortest interval, in whole days, of a scheduled vulnerability scan that includes the asset, as the source states it (a weekly schedule is 7). Below 1 is ignored with a warning (AM-DATA-29)." }
              description: At least one of sourceId and sourceLabel is required (AM-DATA-07).
      responses:
        "200": { description: "An existing asset, reported again.", content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "201": { description: "A new asset.", content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/LimitsUnavailable" }
    delete:
      operationId: assets.deleteByIds
      x-bridge: write
      tags: [Assets]
      summary: Delete the caller's own assets by id
      description: Only assets without a link are deleted; the others are skipped (AM-DATA-27, AM-SEC-10).
      requestBody: { $ref: "#/components/requestBodies/Ids" }
      parameters:
        - $ref: "#/components/parameters/actingRole"
        - $ref: "#/components/parameters/actingUser"
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: assets.get
      x-bridge: read
      x-invalidated-by: [ASSET_CREATED, ASSET_UPDATED, ASSET_DELETED, VULNERABILITY_CREATED, VULNERABILITY_UPDATED, VULNERABILITY_DELETED, DETECTION_CREATED, DETECTION_UPDATED, DETECTION_DELETED]
      tags: [Assets]
      summary: One asset of the visible set
      parameters:
        - $ref: "#/components/parameters/actingUser"
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
              examples:
                anonymous-at-source-limit: { $ref: "#/components/examples/AssetAnonymous" }
                registered-nis2-red-readiness-yellow: { $ref: "#/components/examples/AssetRegistered" }
                registered-nis2-orange-readiness-red: { $ref: "#/components/examples/AssetRegistered" }
                registered-nis2-yellow-readiness-green-strategy-expired: { $ref: "#/components/examples/AssetRegistered" }
                registered-nis2-orange-readiness-in-progress: { $ref: "#/components/examples/AssetRegistered" }
                registered-nis2-impact-in-progress-recommended: { $ref: "#/components/examples/AssetRegistered" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: assets.update
      x-bridge: write
      tags: [Assets]
      summary: Change an asset's type
      description: Only `type` may be sent; any other field is refused with 400 (AM-DATA-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [Host] }
      parameters:
        - $ref: "#/components/parameters/actingRole"
        - $ref: "#/components/parameters/actingUser"
      responses:
        "200": { description: "The asset as it now is.", content: { application/json: { schema: { $ref: "#/components/schemas/Asset" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/by-source:
    parameters:
      - $ref: "#/components/parameters/source"
    delete:
      operationId: assets.deleteBySource
      tags: [Assets]
      summary: Delete a source's assets
      description: |
        Removes the source's links and the assets left without one (AM-DATA-24).
        A user may do so only once the source no longer exists (AM-DATA-26),
        and only for their own assets; a service acts for every owner (AM-SEC-14).
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: assets.clearSourcesBySource
      tags: [Assets]
      summary: Keep a source's assets, without the source
      description: Removes the source's links and keeps the assets (AM-DATA-25).
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/stale:
    delete:
      operationId: assets.deleteStale
      tags: [Assets]
      summary: After a re-import, remove the links it did not touch
      description: Service only (AM-SEC-15). See AM-DATA-28.
      parameters:
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/modifiedBefore"
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/scan-coverage:
    post:
      operationId: assets.applyScanCoverage
      tags: [Assets]
      summary: Apply a scan coverage table
      description: |
        Applied target by target (AM-DATA-31, -32). Body up to 32 MiB
        (AM-SEC-20). When an address would create a host asset while
        SystemManager cannot be asked for the limit, the table is answered
        with 503 instead of the outcome; what was applied before stays
        (AM-DATA-44).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                userId: { type: integer, description: Honoured from a service only. }
                sourceId: { type: integer }
                sourceLabel: { type: string }
                entries:
                  type: array
                  items:
                    type: object
                    required: [target, scanCoverageIntervalDays]
                    properties:
                      target: { type: string, description: 'What the schedule scans, as the table states it: an IP address ("192.168.1.5"), a CIDR network ("192.168.1.0/24"), an address range ("192.168.1.1-192.168.1.50") or a hostname. An address covers its host asset, created when missing; a network or range covers the existing host assets inside it; a hostname is skipped (AM-DATA-31).' }
                      scanCoverageIntervalDays: { type: integer, minimum: 1, description: "The schedule's interval in whole days, at least 1; below 1 the entry counts as invalid (AM-DATA-31)." }
                      scanCoverageVerifiedAt: { type: string, description: "When the table verified the schedule. RFC 3339 with a zone, e.g. \"2025-07-01T00:00:00Z\"; a time without a zone (\"2025-07-01T00:00:00\") is also read. An unreadable time is left out with a warning (AM-API-07)." }
              description: At least one of sourceId and sourceLabel is required.
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  covered: { type: array, items: { type: integer }, description: The asset ids that got the coverage. }
                  created: { type: array, items: { type: integer }, description: The asset ids created for an address. }
                  hostnames: { type: integer }
                  unmatched: { type: integer, description: Networks and ranges that covered no host asset. }
                  invalid: { type: integer }
                  refused: { type: integer, description: Addresses not created because of the host-asset limit. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/LimitsUnavailable" }

  /api/assets/stats:
    get:
      operationId: assets.stats
      x-bridge: read
      x-mcp: read
      x-invalidated-by: [ASSET_CREATED, ASSET_UPDATED, ASSET_DELETED, VULNERABILITY_CREATED, VULNERABILITY_UPDATED, VULNERABILITY_DELETED, DETECTION_CREATED, DETECTION_UPDATED, DETECTION_DELETED]
      tags: [Assets]
      summary: Statistics over the visible set's assets
      description: |
        Counts over the user's assets (in a shared workspace, everyone's in
        it), without listing them: by severity band of the 0–100 severity
        (AM-DATA-40), and the host assets by when they were last seen, last
        scanned, and by their scan coverage interval.
      parameters:
        - $ref: "#/components/parameters/actingUser"
        - $ref: "#/components/parameters/userIdForService"
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetStats" }
              examples:
                anonymous-at-source-limit: { $ref: "#/components/examples/AssetStatsAnonymous" }
                admin-empty: { $ref: "#/components/examples/AssetStatsEmpty" }
                registered-nis2-red-readiness-yellow: { $ref: "#/components/examples/AssetStatsRegistered" }
                registered-nis2-orange-readiness-red: { $ref: "#/components/examples/AssetStatsRegistered" }
                registered-nis2-yellow-readiness-green-strategy-expired: { $ref: "#/components/examples/AssetStatsRegistered" }
                registered-nis2-orange-readiness-in-progress: { $ref: "#/components/examples/AssetStatsRegistered" }
                registered-nis2-impact-in-progress-recommended: { $ref: "#/components/examples/AssetStatsRegistered" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/vulnerabilities:
    get:
      operationId: vulnerabilities.list
      x-bridge: read
      x-mcp: read
      x-invalidated-by: [VULNERABILITY_CREATED, VULNERABILITY_UPDATED, VULNERABILITY_DELETED]
      tags: [Vulnerabilities]
      summary: List the vulnerabilities of the visible set
      description: |
        The weaknesses found on the user's assets (in a shared workspace, on
        everyone's in it) that match `filter`: each with its name (often with
        the CVE), the affected asset (`host`) and port, and `severity` 0–100
        (critical 90–100, high 70–89, medium 40–69, low 1–39); in a filter
        rule severity is written 0.0–10.0. Ordered by severity, highest
        first, then newest first, or by `sort` and `order`. No paging:
        `limit` answers only the first so many, and `total` still counts all
        that match (AM-API-16).
      parameters:
        - $ref: "#/components/parameters/actingUser"
        - $ref: "#/components/parameters/filter"
        - name: sort
          in: query
          description: "Sort by this field instead of the default order; equal values stay newest first. Times sort as times; names and hosts ignoring case. An unknown field is refused with 400, naming the allowed ones (AM-API-16)."
          schema: { type: string, enum: [severity, name, host, createdAt, modifiedAt, lastSeen] }
        - $ref: "#/components/parameters/listOrder"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200":
          description: The vulnerabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vulnerabilities: { type: [array, "null"], items: { $ref: "#/components/schemas/Vulnerability" } }
                  total: { type: integer, description: "The number of vulnerabilities matching the filter — with `limit`, also those not answered." }
                  maxVulnerabilities: { type: integer, description: 0 is no limit. }
              examples:
                anonymous-at-source-limit: { $ref: "#/components/examples/VulnerabilityListAnonymous" }
                admin-empty: { $ref: "#/components/examples/VulnerabilityListEmpty" }
                registered-nis2-red-readiness-yellow: { $ref: "#/components/examples/VulnerabilityListRegistered" }
                registered-nis2-orange-readiness-red: { $ref: "#/components/examples/VulnerabilityListRegistered" }
                registered-nis2-yellow-readiness-green-strategy-expired: { $ref: "#/components/examples/VulnerabilityListRegistered" }
                registered-nis2-orange-readiness-in-progress: { $ref: "#/components/examples/VulnerabilityListRegistered" }
                registered-nis2-impact-in-progress-recommended: { $ref: "#/components/examples/VulnerabilityListRegistered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: vulnerabilities.create
      tags: [Vulnerabilities]
      summary: Create a vulnerability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FindingInput"
                - type: object
                  required: [severity]
                  properties:
                    severity: { type: integer, minimum: 0, maximum: 100, description: "An integer from 0 to 100 (AM-DATA-14); outside it the vulnerability is refused with 400. A scanner's scale is mapped onto it proportionally — CVSS 0.0–10.0 times 10, rounded (7.5 is 75). The bands: 90–100 critical, 70–89 high, 40–69 medium, 1–39 low (AM-DATA-40)." }
      responses:
        "201": { description: "The vulnerability as stored.", content: { application/json: { schema: { $ref: "#/components/schemas/Vulnerability" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/LimitReached" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/LimitsUnavailable" }
    delete:
      operationId: vulnerabilities.deleteByIds
      tags: [Vulnerabilities]
      summary: Delete the caller's own vulnerabilities by id
      description: Only those without a source (AM-DATA-27).
      requestBody: { $ref: "#/components/requestBodies/Ids" }
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/vulnerabilities/by-source:
    parameters:
      - $ref: "#/components/parameters/source"
    delete:
      operationId: vulnerabilities.deleteBySource
      tags: [Vulnerabilities]
      summary: Delete a source's vulnerabilities
      description: Found by the source id (AM-DATA-12, -24).
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: vulnerabilities.clearSourcesBySource
      tags: [Vulnerabilities]
      summary: Keep a source's vulnerabilities, without the source
      description: Clears sourceId and sourceLabel (AM-DATA-25).
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/vulnerabilities/stale:
    delete:
      operationId: vulnerabilities.deleteStale
      tags: [Vulnerabilities]
      summary: After a re-import, remove the vulnerabilities it did not touch
      description: Service only (AM-SEC-15). See AM-DATA-28.
      parameters:
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/modifiedBefore"
      responses:
        "200": { $ref: "#/components/responses/ChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/detections:
    get:
      operationId: detections.list
      x-bridge: read
      x-mcp: read
      x-invalidated-by: [DETECTION_CREATED, DETECTION_UPDATED, DETECTION_DELETED]
      tags: [Detections]
      summary: List the detections of the visible set
      description: |
        What was observed on the user's assets (in a shared workspace, on
        everyone's in it) — services, software, open ports — without a
        severity, that match `filter`: each with its name, the asset
        (`host`) and port. Newest first, or by `sort` and `order`. No paging:
        `limit` answers only the first so many, and `total` still counts all
        that match (AM-API-16).
      parameters:
        - $ref: "#/components/parameters/actingUser"
        - $ref: "#/components/parameters/filter"
        - name: sort
          in: query
          description: "Sort by this field instead of the default order; equal values stay newest first. Times sort as times; names and hosts ignoring case. An unknown field is refused with 400, naming the allowed ones (AM-API-16)."
          schema: { type: string, enum: [name, host, createdAt, modifiedAt, lastSeen] }
        - $ref: "#/components/parameters/listOrder"
        - $ref: "#/components/parameters/listLimit"
      responses:
        "200":
          description: The detections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detections: { type: [array, "null"], items: { $ref: "#/components/schemas/Detection" } }
                  total: { type: integer, description: "The number of detections matching the filter — with `limit`, also those not answered." }
                  maxDetections: { type: integer, description: 0 is no limit. }
              examples:
                anonymous-at-source-limit: { $ref: "#/components/examples/DetectionListAnonymous" }
                admin-empty: { $ref: "#/components/examples/DetectionListEmpty" }
                registered-nis2-red-readiness-yellow: { $ref: "#/components/examples/DetectionListRegistered" }
                registered-nis2-orange-readiness-red: { $ref: "#/components/examples/DetectionListRegistered" }
                registered-nis2-yellow-readiness-green-strategy-expired: { $ref: "#/components/examples/DetectionListRegistered" }
                registered-nis2-orange-readiness-in-progress: { $ref: "#/components/examples/DetectionListRegistered" }
                registered-nis2-impact-in-progress-recommended: { $ref: "#/components/examples/DetectionListRegistered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
